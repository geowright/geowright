name: release

# Publishes the package to npm when a version tag is pushed — from GitHub-hosted runners, through npm TRUSTED
# PUBLISHING (OpenID Connect): there is no npm token anywhere, not in this repository's secrets and not on a laptop.
# npm attaches a provenance statement automatically (this commit, this workflow run).
#
# Two jobs, so that no code from the dependency tree ever runs where the publishing token can be minted:
#   build    the checks, `npm ci` (install scripts run HERE), typecheck, build, `npm pack` -> the .tgz as an artifact.
#            It has no id-token permission.
#   publish  only `id-token: write`. No checkout, no install, no lifecycle scripts: it downloads the .tgz, checks it
#            is byte for byte the file build packed, and publishes exactly that file.
#
# npm side (package settings on npmjs.com -> Trusted publisher): this repository, workflow file `release.yml`,
# environment `npm`. And, once it has worked: Publishing access -> "Require two-factor authentication and disallow
# tokens". Trusted publishing needs npm >= 11.5.1 and Node >= 22.14, on a GitHub-hosted runner.
#
# The `npm` environment (on the publish job) is restricted to `v*` tags and asks a maintainer to approve the job before
# it runs.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # Never from a fork, and never from a copy of this repository under another name.
    if: github.repository == 'geowright/geowright'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # to check that ci passed on this commit
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      # The one workflow that can publish pins its actions to commits, not to tags that can move.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false # no caches in a release build
      - name: The tag is the version, and the tagged commit is on main
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json version $version"; exit 1; }
          [ "$(node -p "require('./package.json').private === true")" = false ] || { echo "package.json is private"; exit 1; }
          git fetch --no-tags --depth=200 origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main"; exit 1; }
      - name: ci passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.total_count')
          [ "$ok" -ge 1 ] || { echo "no successful ci run for $GITHUB_SHA — not publishing"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Pack (the file list is in the log)
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          set -- "$RUNNER_TEMP"/pack/*.tgz
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "expected exactly one .tgz, got: $*"; exit 1; }
          echo "tarball=$(basename "$1")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$1" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/pack/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.repository == 'geowright/geowright'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      id-token: write # OIDC: what npm trusts instead of a token. The ONLY permission of this job.
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: The file is the one build packed
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: echo "$SHA256  $RUNNER_TEMP/package/$TARBALL" | sha256sum -c -
      # --ignore-scripts: no lifecycle script of the package runs in the job that holds the token
      - name: npm publish
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "$RUNNER_TEMP/package/$TARBALL" --access public --ignore-scripts
