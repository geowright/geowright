name: ci

# Keep this lean, and use [skip ci] on
# docs-only / batched commits.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job that matters: everything was developed on macOS, real-world CI is Linux. Validates
  # the SwiftShader flag set and the zero-flake claim on a 4-vCPU hosted runner.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Playwright version (cache key)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # With a warm cache this only installs the apt deps; the browser download is skipped.
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - name: Full suite
        run: npx playwright test
      - name: Flake check (5x; the 20x bar runs on the Mac)
        run: npx playwright test --repeat-each=5
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-test-results
          path: test-results/
          retention-days: 5

  # Optional extended repetition job.
