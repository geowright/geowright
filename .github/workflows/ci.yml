name: ci

# Per push: typecheck + the full suite on hosted Linux. The flake check (--repeat-each) lives in
# flake.yml so that it can never starve this job of its time limit. Use [skip ci] on docs-only /
# batched commits.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything is developed on macOS; real-world CI is Linux. Validates the SwiftShader flag set on a
  # hosted runner, where software GL is ~8x slower than on a desktop machine.
  linux:
    runs-on: ubuntu-latest
    # The suite takes ~21 min here (2 workers). A job that hits its limit is CANCELLED, which looks
    # like neither pass nor fail — keep real headroom.
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Playwright version (cache key)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # With a warm cache this only installs the apt deps; the browser download is skipped.
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - name: Full suite
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-test-results
          path: test-results/
          retention-days: 5

  # The version matrix (Mapbox GL JS 1.13, MapLibre 2-6): one small page, ~60 tests, a few minutes.
  # Its own job and its own Playwright config, so it can never eat into the suite's time limit.
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Playwright version (cache key)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:compat
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compat-test-results
          path: test-results/
          retention-days: 5
