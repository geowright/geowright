<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc"><title id="title">How geowright works</title><desc id="desc">A Playwright test calls geowright. The test-side API uses page.evaluate to communicate with a test-injected in-page engine and MapLibre public-API adapter that reads the explicitly registered app map. Real pointer input travels separately through page.mouse to the map canvas. Assertions retry; failures include map-state diagnostics and screenshots. Register the map only in test or development builds.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#526174" stroke-width="1.5"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#1A7E1F" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1600" height="800" rx="24" fill="#F8FAFC"/><text x="64" y="66" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#526174" letter-spacing="1">READ THE MAP. ACT THROUGH THE BROWSER.</text><text x="64" y="129" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#141923" >How geowright works</text><text x="64" y="180" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#526174" >Public map state for queries. Real browser input for actions.</text><rect x="64" y="236" width="400" height="327" rx="14" fill="#FFFFFF" stroke="#DCE3E9" stroke-width="2"/><rect x="574" y="236" width="418" height="327" rx="14" fill="#FFFFFF" stroke="#DCE3E9" stroke-width="2"/><rect x="1102" y="236" width="434" height="327" rx="14" fill="#FFFFFF" stroke="#DCE3E9" stroke-width="2"/><text x="92" y="283" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#526174" letter-spacing=".6">PLAYWRIGHT / TEST RUNNER</text><text x="92" y="331" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#141923" >geowright(page)</text><text x="92" y="379" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#526174" >Feature queries &amp; matchers</text><text x="92" y="424" font-family="Courier New, monospace" font-size="23" font-weight="400" fill="#141923" >expect(map)</text><text x="92" y="455" font-family="Courier New, monospace" font-size="23" font-weight="400" fill="#141923" >  .toHaveFeature(query)</text><text x="92" y="515" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#526174" >Retrying assertions</text><text x="600" y="283" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#526174" letter-spacing=".4">BROWSER / INJECTED AT TEST TIME</text><rect x="600" y="308" width="366" height="88" rx="8" fill="#E8F3EA"/><text x="620" y="342" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#141923" >In-page engine</text><text x="620" y="375" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#526174" >Queries · visibility · actionability</text><path d="M783 396L783 426" stroke="#526174" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="600" y="434" width="366" height="88" rx="8" fill="#F8FAFC" stroke="#DCE3E9" stroke-width="2"/><text x="620" y="469" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#141923" >MapLibre adapter</text><text x="620" y="501" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#526174" >Public map-library API only</text><text x="1128" y="283" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#526174" letter-spacing=".5">BROWSER / APP UNDER TEST</text><text x="1128" y="331" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#141923" >Registered app map</text><path d="M1136 355L1136 505" stroke="#DCE3E9" stroke-width="1" fill="none" /><path d="M1184 355L1184 505" stroke="#DCE3E9" stroke-width="1" fill="none" /><path d="M1232 355L1232 505" stroke="#DCE3E9" stroke-width="1" fill="none" /><path d="M1280 355L1280 505" stroke="#DCE3E9" stroke-width="1" fill="none" /><path d="M1328 355L1328 505" stroke="#DCE3E9" stroke-width="1" fill="none" /><path d="M1376 355L1376 505" stroke="#DCE3E9" stroke-width="1" fill="none" /><path d="M1424 355L1424 505" stroke="#DCE3E9" stroke-width="1" fill="none" /><path d="M1472 355L1472 505" stroke="#DCE3E9" stroke-width="1" fill="none" /><path d="M1136 355H1496" stroke="#DCE3E9" stroke-width="1" fill="none" /><path d="M1136 403H1496" stroke="#DCE3E9" stroke-width="1" fill="none" /><path d="M1136 451H1496" stroke="#DCE3E9" stroke-width="1" fill="none" /><path d="M1136 499H1496" stroke="#DCE3E9" stroke-width="1" fill="none" /><path d="M1154 467.5L1251.2 422.5L1359.2 422.5L1470.8 373.0" stroke="#C9D4DD" stroke-width="13" stroke-linejoin="round" fill="none"/><path d="M1193.6 365L1280.0 406.0L1280.0 452.5L1395.2 497" stroke="#C9D4DD" stroke-width="13" stroke-linejoin="round" fill="none"/><rect x="1164.8" y="370.0" width="68.4" height="27.0" rx="5" fill="#E8F3EA"/><rect x="1388.0" y="448.0" width="64.8" height="36.0" rx="5" fill="#E8F3EA"/><circle cx="1359.2" cy="422.5" r="29" fill="none" stroke="#1A7E1F" stroke-width="2"/><path d="M1317.2 422.5H1343.2" stroke="#1A7E1F" stroke-width="2" fill="none" /><path d="M1375.2 422.5H1401.2" stroke="#1A7E1F" stroke-width="2" fill="none" /><path d="M1359.2 380.5L1359.2 406.5" stroke="#1A7E1F" stroke-width="2" fill="none" /><path d="M1359.2 438.5L1359.2 464.5" stroke="#1A7E1F" stroke-width="2" fill="none" /><circle cx="1359.2" cy="422.5" r="8" fill="#1A7E1F"/><path d="M1405.2 457.5l0 36 10-10 9 17 9-5-9-16 15-2Z" fill="#141923" stroke="#F8FAFC" stroke-width="3" stroke-linejoin="round"/><text x="1128" y="542" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526174" >MapLibre GL JS / Mapbox GL v1</text><path d="M466 354H570" stroke="#526174" stroke-width="2.5" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="518" y="315" font-family="Courier New, monospace" font-size="14" font-weight="400" fill="#526174" text-anchor="middle">page.evaluate</text><path d="M994 478H1098" stroke="#526174" stroke-width="2.5" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="1047" y="444" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#526174" text-anchor="middle">read state</text><path d="M264 564V622H1319V565" fill="none" stroke="#1A7E1F" stroke-width="3" marker-end="url(#green)"/><rect x="540" y="602" width="504" height="42" rx="0" fill="#F8FAFC"/><text x="792" y="631" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#1A7E1F" text-anchor="middle">Real pointer input · page.mouse</text><text x="64" y="701" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#526174" letter-spacing="1">APP-SIDE HOOK</text><text x="247" y="701" font-family="Courier New, monospace" font-size="23" font-weight="400" fill="#141923" >(window.__geowright_maps ??= {}).main = map</text><text x="64" y="744" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#526174" >Register in a test / development build. Failures include map-state diagnostics and screenshots.</text></svg>