<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>svelte-maplibre-gl Example — hover-styles</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      /* The vendored MapLibre component sizes itself via Tailwind utility classes
         (e.g. class="h-[55vh] min-h-75"), which have no effect since this build does not
         wire up Tailwind. Give its root div a size here instead of fighting its class. */
      #app > div {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
